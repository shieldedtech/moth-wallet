name: Check for Changeset

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# contents: read is required so checkout can fetch this private repo.
permissions:
  contents: read

jobs:
  check-changeset:
    name: Check for Changeset
    # Skip the changesets-generated "version packages" PR — it has no changeset by design.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      # Fails if packages changed without a changeset, prompting the author to add one.
      - name: Verify a changeset exists
        run: yarn changeset status --since=origin/${{ github.base_ref }}
