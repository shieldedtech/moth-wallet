name: Prepare preseed references

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network reference to prepare
        required: true
        default: both
        type: choice
        options:
          - both
          - preview
          - preprod
permissions:
  contents: read

concurrency:
  group: prepare-preseed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-networks:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        name: Select networks
        env:
          REQUESTED_NETWORK: ${{ inputs.network || 'both' }}
        run: |
          case "$REQUESTED_NETWORK" in
            preview)
              printf '%s\n' \
                'matrix={"network":["preview"]}' \
                >> "$GITHUB_OUTPUT"
              ;;
            preprod)
              printf '%s\n' \
                'matrix={"network":["preprod"]}' \
                >> "$GITHUB_OUTPUT"
              ;;
            both)
              printf '%s\n' \
                'matrix={"network":["preview","preprod"]}' \
                >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'Unsupported network: %s\n' "$REQUESTED_NETWORK" >&2
              exit 2
              ;;
          esac

  prepare:
    needs: select-networks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-networks.outputs.matrix) }}
    env:
      NETWORK: ${{ matrix.network }}
      PREPARE_SUMMARY: ${{ github.workspace }}/.preseed-output/preseed-${{ matrix.network }}.json
      EXPORT_DIR: packages/extension/public/preseed/${{ matrix.network }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the repo and uploads artifacts; don't leave
          # the token on disk where an artifact could capture it.
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Every package, not just core: the prepared bundle is tested below with the
      # built CLI before it is uploaded.
      - name: Build packages
        run: yarn build

      # v2: references are now stored with their dust trees collapsed, and the
      # preprod indexer renumbered its event ids after the v1 references were
      # cached, so a v1 preprod reference is refused on refresh. A new key makes the
      # next run build from genesis instead of restoring state it cannot use.
      - name: Restore public preseed state
        id: restore-preseed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.moth/sync/${{ matrix.network }}/__empty_ref__
            ~/.moth/empty-ref/${{ matrix.network }}/height.txt
          key: preseed-v2-${{ matrix.network }}-${{ github.run_id }}
          restore-keys: |
            preseed-v2-${{ matrix.network }}-

      - name: Install preview reference mnemonic
        if: matrix.network == 'preview'
        env:
          PRESEED_MNEMONIC: ${{ secrets.PRESEED_MNEMONIC_PREVIEW }}
        run: |
          test -n "$PRESEED_MNEMONIC"
          umask 077
          install -d -m 700 "$HOME/.moth/empty-ref/$NETWORK"
          printf '%s' "$PRESEED_MNEMONIC" > "$HOME/.moth/empty-ref/$NETWORK/mnemonic.txt"

      - name: Install preprod reference mnemonic
        if: matrix.network == 'preprod'
        env:
          PRESEED_MNEMONIC: ${{ secrets.PRESEED_MNEMONIC_PREPROD }}
        run: |
          test -n "$PRESEED_MNEMONIC"
          umask 077
          install -d -m 700 "$HOME/.moth/empty-ref/$NETWORK"
          printf '%s' "$PRESEED_MNEMONIC" > "$HOME/.moth/empty-ref/$NETWORK/mnemonic.txt"

      - name: Refresh preseed reference to chain tip
        run: node scripts/prepare-preseed.mjs --network "$NETWORK" --summary "$PREPARE_SUMMARY"

      - name: Save public preseed state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.moth/sync/${{ matrix.network }}/__empty_ref__
            ~/.moth/empty-ref/${{ matrix.network }}/height.txt
          key: preseed-v2-${{ matrix.network }}-${{ github.run_id }}

      - name: Remove reference mnemonic
        if: always()
        run: rm -f "$HOME/.moth/empty-ref/$NETWORK/mnemonic.txt"

      # Collapses the dust trees on the way out, and refuses to export anything it
      # could not collapse and verify.
      - name: Export preseed files
        run: node scripts/export-preseed.mjs --network "$NETWORK"

      # Independent of the export: re-reads the files as written and proves the
      # dust state is collapsed, means what the reference meant, and is recorded
      # correctly in the manifest.
      - name: Verify the exported bundle is collapsed and valid
        run: node scripts/collapse-preseed.mjs --dir "$EXPORT_DIR" --check

      # The whole suite runs against the tree the bundle was exported into, so the
      # shipped-bundle tests see the new files.
      - name: Run tests
        run: yarn turbo run test

      # A brand-new CLI wallet seeded from exactly these files, synced to tip on the
      # live network, and relaunched to prove its dust state restores in seconds.
      - name: End-to-end test the exported bundle with the CLI
        env:
          MOTH_E2E_NETWORK: ${{ matrix.network }}
          MOTH_E2E_PRESEED_DIR: ${{ github.workspace }}/${{ env.EXPORT_DIR }}
        run: yarn workspace @shieldedtech/moth-cli test:e2e

      - name: Record checksums and job summary
        run: |
          shasum -a 256 "$EXPORT_DIR"/* > "$EXPORT_DIR/checksums.sha256"
          {
            printf '## Prepared %s preseed\n\n' "$NETWORK"
            printf '### Refresh result\n\n'
            sed 's/^/    /' "$PREPARE_SUMMARY"
            printf '\n### Export manifest\n\n'
            sed 's/^/    /' "$EXPORT_DIR/manifest.json"
            printf '\n### SHA-256 checksums\n\n'
            sed 's/^/    /' "$EXPORT_DIR/checksums.sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prepared preseed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preseed-${{ matrix.network }}-${{ github.run_id }}
          path: |
            ${{ env.EXPORT_DIR }}
            ${{ env.PREPARE_SUMMARY }}
          if-no-files-found: error
          retention-days: 14
