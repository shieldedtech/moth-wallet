name: CI

# Runs the type checks and the full vitest suite (including the i18n and
# no-hardcoded-strings guards) on every PR and on pushes to main. Until this
# existed, nothing ran the tests on GitHub — the guards and unit suite only
# fired on a local `yarn test`, so a regression could merge unnoticed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.1

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Builds the workspace in dependency order (core/browser first) so the
      # extension/cli type checks and tests resolve the built packages.
      - name: Build packages
        run: yarn build

      - name: Typecheck extension
        run: yarn workspace @shieldedtech/moth-extension compile

      - name: Check release workflow policy
        run: yarn test:release-policy

      # Devnet-dependent integration tests self-skip when no devnet is present,
      # so this stays green without Docker; unit tests + guards always run.
      - name: Run tests
        run: yarn turbo run test
