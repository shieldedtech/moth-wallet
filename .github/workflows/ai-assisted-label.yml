name: Label AI-assisted PRs

# Consumer dispatcher: calls the org reusable ai-assisted-label workflow in
# shieldedtech/workflows, pinned to a commit SHA (bump to opt into changes).
# Auto-applies bot:ai-assisted to PRs whose commits or body carry an AI-tooling
# signature. Ships in the template so new repos inherit disclosure enforcement.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: shieldedtech/workflows/.github/workflows/ai-assisted-label.yml@431a4f88f5d8a5a0eca55e429f5f12c8d2b69095
