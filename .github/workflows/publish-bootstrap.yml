name: Publish bootstrap (one-time, token)

# One-time bootstrap publish. npm Trusted Publishing (OIDC) — used by release.yml in
# steady state — can only be configured for packages that ALREADY EXIST, so the very
# first publish of @shieldedtech/moth-{wallet,cli,tui} is done here with an npm token
# (the SHIELDED_NPMJS_TOKEN secret). moth-browser is "private": true and not published.
#
# This mirrors the steady-state release.yml: the same changesets/action publishes to
# npm, pushes the git tags, and creates a GitHub Release per package — the only
# difference is auth (token here via NPM_TOKEN, OIDC there).
#
# After this has run once and trusted publishers are configured for all four packages,
# DELETE the SHIELDED_NPMJS_TOKEN secret and this workflow file — steady-state releases
# go through release.yml via OIDC, with no token. See SRE_PUBLISHING_SETUP.md.
#
# Manual only: run it from Actions → "Publish bootstrap (one-time, token)" → Run workflow.

on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: Bootstrap publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # push git tags + create the GitHub Release

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Update NPM
        run: npm install -g npm@12.0.2

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Packages
        run: yarn build

      # The one pending changeset is empty (no version bump), and we want to publish the
      # current 0.1.0 as the initial release. Removing it puts changesets/action into
      # publish mode (rather than opening a version PR) so it publishes 0.1.0 as-is.
      - name: Clear empty bootstrap changeset
        run: find .changeset -name '*.md' ! -name 'README.md' -delete

      # Same action as release.yml. With no changesets present it runs `yarn release`
      # (publish), then pushes git tags and creates a GitHub Release for each package.
      # NPM_TOKEN makes the action write an .npmrc so `npm publish` authenticates with
      # the bootstrap token. No provenance on this first publish — release.yml adds it
      # automatically once Trusted Publishing is on.
      - name: Publish + tag + GitHub Release (token bootstrap)
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d  # v1.9.0
        with:
          publish: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.SHIELDED_NPMJS_TOKEN }}
