name: Release

on:
  push:
    branches:
      - main
  # Dispatched on a branch that is not ready for main; see the prerelease job.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Preserve every main push so a version commit cannot be replaced while pending.
  queue: max

jobs:
  release:
    name: Release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # version-bump commit + git tags
      pull-requests: write  # open the "version packages" PR
      id-token: write       # npm Trusted Publishing (OIDC) + provenance
    outputs:
      hasReleases: ${{ steps.releases.outputs.hasReleases }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          registry-url: https://registry.npmjs.org

      - name: Configure pinned npm CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-bin"
          cat > "$RUNNER_TEMP/npm-bin/npm" <<'EOF'
          #!/usr/bin/env bash
          exec npx --yes --package=npm@12.0.2 npm "$@"
          EOF
          chmod +x "$RUNNER_TEMP/npm-bin/npm"
          echo "$RUNNER_TEMP/npm-bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Packages
        run: yarn build

      # Detect whether pending changesets actually bump any package — the signal
      # the canary job gates on. (An empty changeset bumps nothing → no canary.)
      - name: Detect releasable changesets
        id: releases
        run: |
          set -uo pipefail
          rm -f changeset-status.json
          yarn changeset status --output=changeset-status.json || true
          COUNT=0
          if [ -f changeset-status.json ]; then
            COUNT=$(node -p "require('./changeset-status.json').releases.length" 2>/dev/null || echo 0)
            rm -f changeset-status.json
          fi
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "hasReleases=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasReleases=false" >> "$GITHUB_OUTPUT"
          fi

      # Registry, tag, and GitHub Release state survive canceled and partial runs.
      # The same process also dry-runs only packages that still need publication.
      - name: Detect incomplete package releases
        if: ${{ steps.releases.outputs.hasReleases == 'false' }}
        id: package_changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-packages.mjs --github-output --validate

      # GITHUB_TOKEN keeps release automation secretless. GitHub puts the
      # generated PR's workflow runs into an approval-required state; a
      # maintainer approves those runs before the version PR can merge.
      - name: Create or update version PR
        if: ${{ steps.releases.outputs.hasReleases == 'true' }}
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v2.1.2
        with:
          # Keep the compound command in a package script; the action does not
          # invoke shell operators when it executes its input.
          version-script: yarn run version-release
          github-token: ${{ github.token }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

      # With no Changesets left, publish through npm Trusted Publishing (OIDC),
      # then recover or create tags and GitHub Releases through Changesets.
      - name: Publish stable release
        if: ${{ steps.releases.outputs.hasReleases == 'false' && steps.package_changes.outputs.hasReleaseWork == 'true' }}
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v2.1.2
        with:
          publish-script: yarn run release
          # Preserve the annotated tag and target commit created by the
          # idempotent publisher, including recovery of older releases.
          push-with-git-cli: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Publishes a snapshot under the `canary` dist-tag on every merge to main that
  # has pending changesets (i.e. before the "version packages" PR is merged).
  # Versions look like 0.2.0-canary.<timestamp>-<sha>; internal deps are pinned to
  # the snapshot version so the canary set installs as a coherent group. Mutually
  # exclusive with the stable publish above (which runs only when no changesets remain).
  canary:
    name: Canary
    needs: [release]
    if: ${{ github.event_name == 'push' && needs.release.outputs.hasReleases == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # npm Trusted Publishing (OIDC) + provenance

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          registry-url: https://registry.npmjs.org

      - name: Install npm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-bin"
          cat > "$RUNNER_TEMP/npm-bin/npm" <<'EOF'
          #!/usr/bin/env bash
          exec npx --yes --package=npm@12.0.2 npm "$@"
          EOF
          chmod +x "$RUNNER_TEMP/npm-bin/npm"
          echo "$RUNNER_TEMP/npm-bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Publish canary snapshot
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # Pin internal sibling ranges to the snapshot version: a "-canary"
          # prerelease doesn't satisfy a caret range, so without this the siblings
          # would resolve from the registry (stale) and the published canary set
          # would be internally inconsistent.
          node -e '
            const fs = require("fs");
            const p = ".changeset/config.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.___experimentalUnsafeOptions_WILL_CHANGE_IN_PATCH = {
              ...c.___experimentalUnsafeOptions_WILL_CHANGE_IN_PATCH,
              updateInternalDependents: "always",
            };
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

          yarn changeset version --snapshot "canary.${TIMESTAMP}-${SHORT_SHA}"
          yarn install --mode=update-lockfile
          yarn build
          yarn changeset publish --tag canary --no-git-tag

  # Publishes a snapshot of a branch that runs in parallel with main, under the
  # `next` dist-tag, when this workflow is dispatched on that branch. Versions look
  # like 0.15.0-next.<timestamp>-<sha>. Nothing is committed or tagged, so the
  # branch later merges into main unchanged; main is refused, it has the canary.
  prerelease:
    name: Prerelease (next)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # npm Trusted Publishing (OIDC) + provenance

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Nothing here pushes, and the job uploads an artifact; keep the token off disk.
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          registry-url: https://registry.npmjs.org

      - name: Install npm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-bin"
          cat > "$RUNNER_TEMP/npm-bin/npm" <<'EOF'
          #!/usr/bin/env bash
          exec npx --yes --package=npm@12.0.2 npm "$@"
          EOF
          chmod +x "$RUNNER_TEMP/npm-bin/npm"
          echo "$RUNNER_TEMP/npm-bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: yarn install --immutable

      # Snapshot versions are computed from the branch's own package.json, so a
      # branch that predates main's last release would publish below it.
      - name: Require the latest release and pending changesets
        run: |
          set -euo pipefail
          LATEST=$(git describe --tags --abbrev=0 --match '@shieldedtech/moth-wallet@*' origin/main)
          if ! git merge-base --is-ancestor "$LATEST" HEAD; then
            echo "::error::This branch does not contain ${LATEST}. Merge main into it before publishing a prerelease."
            exit 1
          fi
          # A dispatched branch has origin/main but no local main, which is what
          # status compares against by default.
          rm -f changeset-status.json
          yarn changeset status --since=origin/main --output=changeset-status.json
          COUNT=$(node -p "require('./changeset-status.json').releases.length")
          rm -f changeset-status.json
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No changeset on this branch bumps a package, so there is nothing to prerelease."
            exit 1
          fi

      - name: Publish next snapshot
        id: snapshot
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # Pin internal sibling ranges to the snapshot version, as the canary does.
          node -e '
            const fs = require("fs");
            const p = ".changeset/config.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.___experimentalUnsafeOptions_WILL_CHANGE_IN_PATCH = {
              ...c.___experimentalUnsafeOptions_WILL_CHANGE_IN_PATCH,
              updateInternalDependents: "always",
            };
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

          yarn changeset version --snapshot "next.${TIMESTAMP}-${SHORT_SHA}"
          yarn install --mode=update-lockfile
          yarn build
          yarn changeset publish --tag next --no-git-tag
          echo "version=$(node -p "require('./packages/extension/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build extension ZIP
        run: yarn workspace @shieldedtech/moth-extension zip

      - name: Verify extension ZIP
        env:
          ARTIFACT: packages/extension/.output/moth-extension-${{ steps.snapshot.outputs.version }}-chrome.zip
        run: |
          set -euo pipefail
          test -s "$ARTIFACT"
          unzip -tq "$ARTIFACT"
          for network in preview preprod; do
            for part in manifest.json dust.dat.gz shielded.dat.gz unshielded.dat.gz; do
              unzip -tq "$ARTIFACT" "preseed/${network}/${part}"
            done
          done

      # An unsigned build for testers, kept on the run; the signed GitHub
      # Release remains Extension CD's job on main.
      - name: Upload extension ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: moth-extension-${{ steps.snapshot.outputs.version }}-chrome
          path: packages/extension/.output/moth-extension-${{ steps.snapshot.outputs.version }}-chrome.zip
          if-no-files-found: error
          retention-days: 30
