name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # version-bump commit + git tags
      pull-requests: write  # open the "version packages" PR
      id-token: write       # npm Trusted Publishing (OIDC) + provenance
    outputs:
      hasReleases: ${{ steps.releases.outputs.hasReleases }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install npm
        run: npm install --global npm@12.0.2

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Packages
        run: yarn build

      # Detect whether pending changesets actually bump any package — the signal
      # the canary job gates on. (An empty changeset bumps nothing → no canary.)
      - name: Detect releasable changesets
        id: releases
        run: |
          set -uo pipefail
          rm -f changeset-status.json
          yarn changeset status --output=changeset-status.json || true
          COUNT=0
          if [ -f changeset-status.json ]; then
            COUNT=$(node -p "require('./changeset-status.json').releases.length" 2>/dev/null || echo 0)
            rm -f changeset-status.json
          fi
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "hasReleases=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasReleases=false" >> "$GITHUB_OUTPUT"
          fi

          CHANGESET_COUNT=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          if [ "${CHANGESET_COUNT:-0}" -gt 0 ]; then
            echo "hasChangesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasChangesets=false" >> "$GITHUB_OUTPUT"
          fi

      # A push with no Changesets is usually a documentation or workflow-only
      # change. Do not invoke `changeset publish` in that case: npm versions are
      # immutable, so it would fail while trying to republish the current
      # versions. Only publish when a public package version is absent from npm.
      - name: Detect unpublished package versions
        id: unpublished
        run: |
          set -euo pipefail
          has_unpublished=false
          for package_json in packages/*/package.json; do
            package_name=$(node -p "require('./${package_json}').name")
            package_version=$(node -p "require('./${package_json}').version")
            is_private=$(node -p "Boolean(require('./${package_json}').private)")
            if [ "$is_private" = "true" ]; then
              continue
            fi
            published_version=$(npm view "${package_name}@${package_version}" version --json)
            # npm may emit a JSON string with or without quotes depending on
            # the npm version used by the runner; normalize both forms.
            published_version=$(printf '%s' "$published_version" | tr -d '"[:space:]')
            if [ "$published_version" != "${package_version}" ]; then
              echo "${package_name}@${package_version} is not published"
              has_unpublished=true
            fi
          done
          echo "hasUnpublished=${has_unpublished}" >> "$GITHUB_OUTPUT"

      # Use the machine-user PAT only while opening or updating the version PR.
      # It is deliberately absent from the stable publish process below.
      - name: Create or update version PR
        if: ${{ steps.releases.outputs.hasChangesets == 'true' }}
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d  # v1.9.0
        with:
          # `yarn run` so Yarn Berry runs the package scripts, not its built-in
          # `yarn version` command (which needs a <strategy> arg and ignores the
          # "version" script — the cause of the release failure).
          version: yarn run version && yarn install
          commitMode: github-api
          github-token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          title: "chore: version packages"
          commit: "chore: version packages"

      # With no Changesets left, publish through npm Trusted Publishing (OIDC),
      # then use the ephemeral Actions token for tags and GitHub Releases.
      - name: Publish stable release
        if: ${{ steps.releases.outputs.hasChangesets == 'false' && steps.unpublished.outputs.hasUnpublished == 'true' }}
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d  # v1.9.0
        with:
          publish: yarn run release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Publishes a snapshot under the `canary` dist-tag on every merge to main that
  # has pending changesets (i.e. before the "version packages" PR is merged).
  # Versions look like 0.2.0-canary.<timestamp>-<sha>; internal deps are pinned to
  # the snapshot version so the canary set installs as a coherent group. Mutually
  # exclusive with the stable publish above (which runs only when no changesets remain).
  canary:
    name: Canary
    needs: [release]
    if: ${{ github.event_name == 'push' && needs.release.outputs.hasReleases == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # npm Trusted Publishing (OIDC) + provenance

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install npm
        run: npm install --global npm@12.0.2

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Publish canary snapshot
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # Pin internal sibling ranges to the snapshot version: a "-canary"
          # prerelease doesn't satisfy a caret range, so without this the siblings
          # would resolve from the registry (stale) and the published canary set
          # would be internally inconsistent.
          node -e '
            const fs = require("fs");
            const p = ".changeset/config.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.___experimentalUnsafeOptions_WILL_CHANGE_IN_PATCH = {
              ...c.___experimentalUnsafeOptions_WILL_CHANGE_IN_PATCH,
              updateInternalDependents: "always",
            };
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

          yarn changeset version --snapshot "canary.${TIMESTAMP}-${SHORT_SHA}"
          yarn install --mode=update-lockfile
          yarn build
          yarn changeset publish --tag canary --no-git-tag
