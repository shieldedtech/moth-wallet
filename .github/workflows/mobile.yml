name: Mobile

# Builds Moth for iOS and Android against this commit's packages, so a change to core or the
# extension worker that breaks an app fails here rather than on a phone. A change runs only
# the platform it touches; a change to code both apps share runs both.
on:
  pull_request:
    paths:
      - mobile/**
      - packages/core/**
      - packages/browser/**
      - packages/extension/lib/**
      - packages/extension/public/preseed/**
      - .github/workflows/mobile.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile/**
      - packages/core/**
      - packages/browser/**
      - packages/extension/lib/**
      - packages/extension/public/preseed/**
      - .github/workflows/mobile.yml

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The Android app reuses the iOS engine page, the native prover and the ledger WASM
      # build, so those paths are shared, like the packages the engine is built from.
      # A manual run, or a push whose base commit is unknown, builds both.
      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          ios=false android=false
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            ios=true android=true
          else
            while IFS= read -r f; do
              case "$f" in
                mobile/android/*) android=true ;;
                mobile/ios/engine/* | mobile/ios/native/* | mobile/ios/proof-server/* | \
                mobile/ios/scripts/build-engine.sh | mobile/ios/scripts/build-ledger-wasm.sh | \
                mobile/ios/scripts/ledger-irloader-rc.patch | \
                packages/core/* | packages/browser/* | packages/extension/lib/* | \
                packages/extension/public/preseed/* | .github/workflows/mobile.yml)
                  ios=true android=true ;;
                mobile/ios/*) ios=true ;;
              esac
            done < <(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          fi
          echo "ios=$ios android=$android"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  ios:
    name: iOS build and UI test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Pinned image: the Xcode and simulator runtimes come from it.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        working-directory: .
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        working-directory: .
        run: yarn install --immutable

      # Only what the app and its tests use: core and moth-browser for the engine, the mock
      # DApp for the connector test. The extension's own bundle isn't needed.
      - name: Build packages
        working-directory: .
        run: yarn turbo run build --filter=@shieldedtech/moth-browser... --filter=@shieldedtech/moth-mock-dapp

      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim wasm32-unknown-unknown

      - name: Restore patched ledger WASM
        id: ledger-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/ios/vendor/ledger-v8
          key: ledger-v8-${{ hashFiles('mobile/ios/scripts/build-ledger-wasm.sh', 'mobile/ios/scripts/ledger-irloader-rc.patch', 'yarn.lock') }}

      # Apple's clang cannot target wasm32, which the ledger's C dependencies need.
      - name: Install ledger toolchain
        if: steps.ledger-cache.outputs.cache-hit != 'true'
        run: brew install llvm wasm-pack

      - name: Build patched ledger WASM
        if: steps.ledger-cache.outputs.cache-hit != 'true'
        run: scripts/build-ledger-wasm.sh

      - name: Save patched ledger WASM
        if: steps.ledger-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/ios/vendor/ledger-v8
          key: ${{ steps.ledger-cache.outputs.cache-primary-key }}

      # The cached build has no node_modules link; the generated glue imports through it.
      - name: Link ledger dependencies
        run: ln -sfn "$GITHUB_WORKSPACE/node_modules" vendor/node_modules

      - name: Build engine
        run: scripts/build-engine.sh

      - name: Build for simulator
        run: >-
          xcodebuild build -project Moth.xcodeproj -scheme Moth -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData

      - name: Build for device
        run: >-
          xcodebuild build -project Moth.xcodeproj -scheme Moth -configuration Release
          -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      # Syncs a fresh wallet on preprod, so it needs the public indexer to be up.
      - name: UI tests
        run: scripts/ui-test.sh

  android:
    name: Android build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        working-directory: .
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        working-directory: .
        run: yarn install --immutable

      # The engine page is all the app needs from the workspace.
      - name: Build packages
        working-directory: .
        run: yarn turbo run build --filter=@shieldedtech/moth-browser...

      - name: Install Rust targets
        run: rustup target add aarch64-linux-android wasm32-unknown-unknown

      # The iOS job caches the same build, but caches don't cross from macOS to Linux.
      - name: Restore patched ledger WASM
        id: ledger-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/ios/vendor/ledger-v8
          key: ledger-v8-linux-${{ hashFiles('mobile/ios/scripts/build-ledger-wasm.sh', 'mobile/ios/scripts/ledger-irloader-rc.patch', 'yarn.lock') }}

      - name: Install ledger toolchain
        if: steps.ledger-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          cargo install wasm-pack --locked

      - name: Build patched ledger WASM
        if: steps.ledger-cache.outputs.cache-hit != 'true'
        env:
          LLVM_BIN: /usr/bin
        run: ../ios/scripts/build-ledger-wasm.sh

      - name: Save patched ledger WASM
        if: steps.ledger-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/ios/vendor/ledger-v8
          key: ${{ steps.ledger-cache.outputs.cache-primary-key }}

      # The cached build has no node_modules link; the generated glue imports through it.
      - name: Link ledger dependencies
        run: ln -sfn "$GITHUB_WORKSPACE/node_modules" ../ios/vendor/node_modules

      - name: Build engine
        run: ../ios/scripts/build-engine.sh

      - name: Bundle engine
        run: scripts/bundle-engine.sh

      # cross runs the Android NDK in Docker, which the runner provides.
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build native library
        run: scripts/build-native.sh

      # No Gradle wrapper yet, so pin the version the README asks for.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle assembleDebug
