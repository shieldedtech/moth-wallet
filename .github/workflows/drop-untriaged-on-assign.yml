name: Drop status:untriaged once an issue is assigned

on:
  issues:
    types: [assigned, labeled]

permissions:
  issues: write

concurrency:
  group: drop-untriaged-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  drop-untriaged:
    name: Remove status:untriaged from assigned issues
    uses: shieldedtech/workflows/.github/workflows/drop-untriaged-on-assign.yml@431a4f88f5d8a5a0eca55e429f5f12c8d2b69095
