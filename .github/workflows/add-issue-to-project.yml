name: Add new issues to SRE board

on:
  issues:
    types: [opened]

permissions:
  issues: read

jobs:
  add-to-project:
    name: Add issue to Shielded SRE Board (Backlog)
    uses: shieldedtech/workflows/.github/workflows/add-issue-to-project.yml@431a4f88f5d8a5a0eca55e429f5f12c8d2b69095
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    with:
      project_number: 50
      project_owner: shieldedtech
