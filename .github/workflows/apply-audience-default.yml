name: Apply audience default

# Dispatcher — calls the reusable workflow in `shieldedtech/workflows`.
# Defaults `audience:shielded` on issue open when no audience:* label is set.
# Add-only, idempotent, existence-gated (no-op if the label is absent).
# Implementation:
# https://github.com/shieldedtech/workflows/blob/main/.github/workflows/apply-audience-default.yml

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-audience-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Default audience:shielded on open
    uses: shieldedtech/workflows/.github/workflows/apply-audience-default.yml@431a4f88f5d8a5a0eca55e429f5f12c8d2b69095
