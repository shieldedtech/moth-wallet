name: Apply priority from form

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-priority-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Set native Priority from form dropdown
    uses: shieldedtech/.github/.github/workflows/apply-priority-from-form.yml@bd9b405ee1f7f86ff67861a4172347faf3c981ec # shieldedtech/.github#40 (native-only)
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
