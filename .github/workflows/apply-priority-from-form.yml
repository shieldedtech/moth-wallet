name: Apply priority from form

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-priority-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Set native Priority from form dropdown
    uses: shieldedtech/workflows/.github/workflows/apply-priority-from-form.yml@431a4f88f5d8a5a0eca55e429f5f12c8d2b69095 # native-only impl; public home per shielded-iac#3001
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
