name: Extension CD

on:
  push:
    branches:
      - main
    paths:
      - 'packages/extension/**'
      - 'packages/core/**'
      - 'packages/browser/**'
      - 'packages/cli/**'
      - 'packages/tui/**'
      - 'packages/extension/public/preseed/**'
      - 'yarn.lock'
      - '.nvmrc'
      - 'package.json'
      - 'turbo.json'
  workflow_dispatch: {}

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-extension:
    name: Build and release extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build extension dependencies
        run: |
          yarn workspace @shieldedtech/moth-wallet build
          yarn workspace @shieldedtech/moth-browser build

      - name: Validate release version
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./packages/extension/package.json').version")"
          {
            echo "version=$version"
            echo "tag=moth-extension-v${version}"
            echo "artifact=packages/extension/.output/moth-extension-${version}-chrome.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Typecheck extension
        run: yarn workspace @shieldedtech/moth-extension compile

      - name: Build extension ZIP
        run: yarn workspace @shieldedtech/moth-extension zip

      - name: Verify extension ZIP
        env:
          ARTIFACT: ${{ steps.release.outputs.artifact }}
        run: |
          set -euo pipefail
          test -s "$ARTIFACT"
          unzip -tq "$ARTIFACT"
          for network in preview preprod; do
            for part in manifest.json dust.dat.gz shielded.dat.gz unshielded.dat.gz; do
              unzip -tq "$ARTIFACT" "preseed/${network}/${part}"
            done
          done

          for network in preview preprod; do
            manifest="$RUNNER_TEMP/preseed-${network}-manifest.json"
            unzip -p "$ARTIFACT" "preseed/${network}/manifest.json" > "$manifest"
            NETWORK="$network" MANIFEST="$manifest" node --input-type=module -e '
            import fs from "node:fs";

            const network = process.env.NETWORK;
            const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, "utf8"));
            const parts = ["dust", "shielded", "unshielded"];
            if (manifest.network !== network || !Number.isInteger(manifest.height) || manifest.height <= 0) {
              throw new Error(network + " preseed manifest has no valid network or height");
            }
            for (const part of parts) {
              if (!Number.isInteger(manifest.parts?.[part]?.gzipBytes) || manifest.parts[part].gzipBytes <= 0) {
                throw new Error(network + " preseed manifest is missing a valid " + part + " gzip size");
              }
            }
            '
          done

      - name: Create extension tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists; reusing it for an idempotent release run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release Moth Wallet Extension ${TAG#moth-extension-v}"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.release.outputs.artifact }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          release_args=(
            "$TAG"
            "$ARTIFACT#Moth Wallet Extension for Chrome (Manifest V3)"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "Moth Wallet Extension v${VERSION}"
            --generate-notes
          )

          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$ARTIFACT#Moth Wallet Extension for Chrome (Manifest V3)" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "${release_args[@]}"
          fi
