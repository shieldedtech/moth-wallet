name: Bug report
description: Something is broken or behaving unexpectedly.
title: "bug: "
labels: ["status:untriaged"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the fields below.
        For security vulnerabilities, **do not file a public issue** — see SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Which version, tag, or commit are you running?
      placeholder: "v1.2.3 or commit sha"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: |
        Engineering urgency. Triage can adjust later. Set on the native
        Priority issue field (source of truth), not as a label.
        - P0 - Blocking — drop everything to work on this
        - P1 - Critical — schedule immediately
        - P2 - High — schedule this sprint
        - P3 - Medium — schedule next sprint (default)
        - P4 - Low — schedule when capacity allows
      options:
        - P3 - Medium
        - P2 - High
        - P1 - Critical
        - P0 - Blocking
        - P4 - Low
      default: 0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions, relevant config.
      placeholder: "macOS 14.5, Node 22.6.0, Compact 0.31.0"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal sequence that triggers the bug.
      placeholder: |
        1. Run `…`
        2. Observe `…`
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened. Include logs, error messages, screenshots.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant — related issues, workarounds tried, hypothesis about root cause.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability (if it is, I will report via SECURITY.md).
          required: true
