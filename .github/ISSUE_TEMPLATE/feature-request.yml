name: Feature request
description: Propose a new feature or enhancement.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then propose a solution. Feature requests framed around
        a concrete use case are easier to evaluate than open-ended specs.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: |
        Engineering urgency. Triage can adjust later. Set on the native
        Priority issue field (source of truth), not as a label.
        - P0 - Blocking — drop everything to work on this
        - P1 - Critical — schedule immediately
        - P2 - High — schedule this sprint
        - P3 - Medium — schedule next sprint (default)
        - P4 - Low — schedule when capacity allows
      options:
        - P3 - Medium
        - P2 - High
        - P1 - Critical
        - P0 - Blocking
        - P4 - Low
      default: 0
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? API sketches, UI mockups, or behavior descriptions all welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one wins.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, prior art, related issues.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
