<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Moth for iOS: architecture</title>
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #1c1f36; }
    .subtitle { font-size: 14px; fill: #5b5f7a; }
    .band-title { font-size: 15px; font-weight: 700; fill: #1c1f36; }
    .band-path { font-size: 12.5px; fill: #5b5f7a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .box-title { font-size: 14.5px; font-weight: 650; fill: #1c1f36; }
    .box-text { font-size: 12px; fill: #2f3350; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .label { font-size: 11px; fill: #3b3f5c; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .phone-label { font-size: 13px; font-weight: 600; fill: #5b5f7a; letter-spacing: 0.04em; }
    .arrow { stroke: #3b3f5c; stroke-width: 1.6; fill: none; }
    .event { stroke: #3b3f5c; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .swift-band { fill: #fff6ee; stroke: #f0b88a; }
    .swift { fill: #fde2c8; stroke: #e8792b; }
    .ts-band { fill: #f2f7fe; stroke: #9cbfe9; }
    .ts { fill: #d6e6fb; stroke: #3178c6; }
    .rust-band { fill: #faf3ee; stroke: #d3ad98; }
    .rust { fill: #ead9cf; stroke: #a35532; }
    .ext-band { fill: #f7f7f7; stroke: #c4c4c4; }
    .ext { fill: #ececec; stroke: #8a8a8a; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3f5c"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="20" y="38" class="title">Moth for iOS</text>
  <text x="196" y="38" class="subtitle">three parts, three languages · seed never leaves the engine · no proving off the phone</text>

  <!-- Phone -->
  <rect x="260" y="56" width="1000" height="824" rx="34" fill="#ffffff" stroke="#1c1f36" stroke-width="2"/>
  <text x="284" y="80" class="phone-label">IPHONE · MOTH.APP</text>

  <!-- Swift band -->
  <rect x="280" y="92" width="960" height="228" rx="14" class="swift-band"/>
  <text x="296" y="116" class="band-title">App and UI · Swift / SwiftUI</text>
  <text x="510" y="116" class="band-path">mobile/ios/Moth/</text>

  <rect x="300" y="136" width="190" height="70" rx="10" class="swift"/>
  <text x="314" y="158" class="box-title">Screens</text>
  <text x="314" y="177" class="box-text">Wallet · Activity · Browser</text>
  <text x="314" y="194" class="box-text">Settings · approval sheets</text>

  <rect x="560" y="136" width="170" height="70" rx="10" class="swift"/>
  <text x="574" y="158" class="box-title">WalletModel</text>
  <text x="574" y="177" class="box-text">accounts · balances</text>
  <text x="574" y="194" class="box-text">approval queue</text>

  <rect x="820" y="136" width="190" height="70" rx="10" class="swift"/>
  <text x="834" y="158" class="box-title">Engine host</text>
  <text x="834" y="177" class="box-text">hidden WKWebView</text>
  <text x="834" y="194" class="box-text mono">callAsyncJavaScript</text>

  <rect x="300" y="245" width="190" height="60" rx="10" class="swift"/>
  <text x="314" y="268" class="box-title">DAppBrowser</text>
  <text x="314" y="288" class="box-text">WKWebView · own storage</text>

  <rect x="560" y="245" width="80" height="60" rx="10" class="swift"/>
  <text x="572" y="268" class="box-title">Vault</text>
  <text x="572" y="288" class="box-text">Keychain</text>

  <rect x="650" y="245" width="80" height="60" rx="10" class="swift"/>
  <text x="660" y="268" class="box-title">DebugLog</text>
  <text x="660" y="288" class="box-text">→ Logs</text>

  <rect x="820" y="245" width="190" height="60" rx="10" class="swift"/>
  <text x="834" y="268" class="box-title">EngineScheme</text>
  <text x="834" y="288" class="box-text mono">moth://engine/ · no port</text>

  <!-- TypeScript band -->
  <rect x="280" y="340" width="960" height="270" rx="14" class="ts-band"/>
  <text x="296" y="576" class="band-title">Wallet engine · TypeScript → JS + WASM</text>
  <text x="296" y="596" class="band-path">mobile/ios/engine/ + moth packages/</text>

  <rect x="300" y="380" width="190" height="90" rx="10" class="ts"/>
  <text x="314" y="402" class="box-title">inject.js</text>
  <text x="314" y="422" class="box-text">runs in the DApp page</text>
  <text x="314" y="440" class="box-text mono">window.midnight.moth</text>
  <text x="314" y="457" class="box-text">connector API 4.0.1</text>

  <rect x="520" y="380" width="320" height="120" rx="10" class="ts"/>
  <text x="534" y="402" class="box-title">Engine page · <tspan class="mono">moth://engine/</tspan></text>
  <text x="534" y="425" class="box-text"><tspan class="mono">main.ts</tspan>  window.moth API</text>
  <text x="534" y="446" class="box-text"><tspan class="mono">host.ts</tspan>  sessions: the seed stays here</text>
  <text x="534" y="467" class="box-text"><tspan class="mono">connector.ts</tspan>  DApp dispatch, approvals</text>
  <text x="534" y="488" class="box-text">only dependency-free modules on this thread</text>

  <rect x="900" y="380" width="320" height="120" rx="10" class="ts"/>
  <text x="914" y="402" class="box-title">moth wallet worker (unchanged)</text>
  <text x="914" y="425" class="box-text">Midnight wallet SDK</text>
  <text x="914" y="446" class="box-text">ledger-v8 WASM, patched DUST restore</text>
  <text x="914" y="467" class="box-text">Lucid for Cardano</text>
  <text x="914" y="488" class="box-text mono">packages/extension/…/wallet-worker.ts</text>

  <!-- IndexedDB cylinder -->
  <path d="M960,533 a100,9 0 0,0 200,0 v40 a100,9 0 0,1 -200,0 z" class="ts"/>
  <ellipse cx="1060" cy="533" rx="100" ry="9" class="ts"/>
  <text x="1060" y="563" class="box-title" text-anchor="middle" font-size="13">IndexedDB</text>
  <text x="1060" y="597" class="box-text" text-anchor="middle">encrypted keystore · sync state</text>

  <!-- Rust band -->
  <rect x="580" y="630" width="660" height="230" rx="14" class="rust-band"/>
  <text x="596" y="656" class="band-title">Prover · Rust</text>
  <text x="596" y="676" class="band-path">mobile/ios/native/ + proof-server/</text>

  <rect x="900" y="668" width="320" height="64" rx="10" class="rust"/>
  <text x="914" y="692" class="box-title">libmoth_native</text>
  <text x="914" y="714" class="box-text">C ABI · loopback server + in-process calls</text>

  <rect x="900" y="760" width="320" height="64" rx="10" class="rust"/>
  <text x="914" y="784" class="box-title">Midnight proof server</text>
  <text x="914" y="806" class="box-text">midnight-ledger 8.1.3, vendored · on the phone</text>

  <path d="M620,774 a110,9 0 0,0 220,0 v38 a110,9 0 0,1 -220,0 z" class="rust"/>
  <ellipse cx="730" cy="774" rx="110" ry="9" class="rust"/>
  <text x="730" y="800" class="box-title" text-anchor="middle" font-size="13">zk params</text>
  <text x="730" y="840" class="box-text" text-anchor="middle">bundled → Caches/zk-params</text>

  <!-- Legend -->
  <text x="296" y="660" class="band-title">Key</text>
  <rect x="296" y="676" width="16" height="16" rx="4" class="swift"/><text x="320" y="689" class="box-text">Swift</text>
  <rect x="380" y="676" width="16" height="16" rx="4" class="ts"/><text x="404" y="689" class="box-text">TypeScript</text>
  <rect x="296" y="704" width="16" height="16" rx="4" class="rust"/><text x="320" y="717" class="box-text">Rust</text>
  <rect x="380" y="704" width="16" height="16" rx="4" class="ext"/><text x="404" y="717" class="box-text">off the phone</text>
  <line x1="296" y1="748" x2="346" y2="748" class="arrow" marker-end="url(#head)"/><text x="356" y="752" class="box-text">call or request</text>
  <line x1="296" y1="772" x2="346" y2="772" class="event" marker-end="url(#head)"/><text x="356" y="776" class="box-text">events back</text>
  <text x="296" y="806" class="box-text">Proofs use loopback because the</text>
  <text x="296" y="822" class="box-text">wallet SDK accepts only http(s) URLs.</text>

  <!-- Off the phone: DApp -->
  <rect x="20" y="230" width="220" height="90" rx="14" class="ext-band"/>
  <rect x="34" y="245" width="192" height="60" rx="10" class="ext"/>
  <text x="48" y="268" class="box-title">DApp website</text>
  <text x="48" y="288" class="box-text">on the internet</text>

  <!-- Off the phone: network services -->
  <rect x="1278" y="340" width="304" height="250" rx="14" class="ext-band"/>
  <text x="1292" y="364" class="band-title">Network services</text>
  <rect x="1292" y="380" width="276" height="56" rx="10" class="ext"/>
  <text x="1306" y="402" class="box-title">Midnight indexer</text>
  <text x="1306" y="422" class="box-text mono">indexer.preprod.shielded.tools</text>
  <rect x="1292" y="442" width="276" height="56" rx="10" class="ext"/>
  <text x="1306" y="464" class="box-title">Midnight node</text>
  <text x="1306" y="484" class="box-text mono">rpc.preprod.midnight.network</text>
  <rect x="1292" y="508" width="276" height="56" rx="10" class="ext"/>
  <text x="1306" y="530" class="box-title">Blockfrost (Cardano)</text>
  <text x="1306" y="550" class="box-text mono">cardano-preprod.blockfrost.io</text>

  <!-- Drawn first so labels' halos sit on top of it -->
  <path d="M870,305 V700 H897" class="arrow" marker-end="url(#head)"/>

  <!-- Arrows: Swift -->
  <line x1="490" y1="165" x2="557" y2="165" class="arrow" marker-end="url(#head)"/>
  <text x="525" y="157" class="label" text-anchor="middle">actions</text>
  <line x1="730" y1="160" x2="817" y2="160" class="arrow" marker-end="url(#head)"/>
  <text x="775" y="152" class="label" text-anchor="middle">window.moth.*</text>
  <line x1="820" y1="188" x2="733" y2="188" class="event" marker-end="url(#head)"/>
  <text x="775" y="202" class="label" text-anchor="middle">events</text>
  <path d="M490,275 H525 V196 H557" class="arrow" marker-end="url(#head)"/>
  <text x="519" y="236" class="label" text-anchor="end">DApp calls</text>
  <line x1="600" y1="206" x2="600" y2="242" class="arrow" marker-end="url(#head)"/>
  <text x="606" y="228" class="label">Face ID</text>
  <line x1="690" y1="206" x2="690" y2="242" class="arrow" marker-end="url(#head)"/>
  <line x1="935" y1="206" x2="935" y2="242" class="arrow" marker-end="url(#head)"/>
  <text x="941" y="228" class="label">loads</text>

  <!-- Arrows: DApp -->
  <line x1="226" y1="275" x2="297" y2="275" class="arrow" marker-end="url(#head)"/>
  <text x="262" y="267" class="label" text-anchor="middle">loads</text>
  <line x1="350" y1="305" x2="350" y2="377" class="arrow" marker-end="url(#head)"/>
  <text x="344" y="348" class="label" text-anchor="end">injects</text>
  <line x1="440" y1="380" x2="440" y2="308" class="arrow" marker-end="url(#head)"/>
  <text x="446" y="348" class="label">calls · origin checked</text>

  <!-- Arrows: engine -->
  <line x1="830" y1="305" x2="830" y2="377" class="arrow" marker-end="url(#head)"/>
  <text x="822" y="332" class="label" text-anchor="end">serves page, worker, WASM, snapshots</text>
  <line x1="840" y1="420" x2="897" y2="420" class="arrow" marker-end="url(#head)"/>
  <text x="869" y="412" class="label" text-anchor="middle">os/* RPC</text>
  <line x1="900" y1="460" x2="843" y2="460" class="event" marker-end="url(#head)"/>
  <text x="869" y="476" class="label" text-anchor="middle">events</text>
  <line x1="1060" y1="500" x2="1060" y2="521" class="arrow" marker-end="url(#head)"/>

  <!-- Arrows: network -->
  <line x1="1220" y1="408" x2="1289" y2="408" class="arrow" marker-end="url(#head)"/>
  <text x="1254" y="400" class="label" text-anchor="middle">GraphQL</text>
  <line x1="1220" y1="470" x2="1289" y2="470" class="arrow" marker-end="url(#head)"/>
  <text x="1254" y="462" class="label" text-anchor="middle">submit</text>
  <path d="M1220,490 H1255 V536 H1289" class="arrow" marker-end="url(#head)"/>
  <text x="1250" y="522" class="label" text-anchor="end">cNIGHT · ADA</text>

  <!-- Arrows: prover -->
  <line x1="930" y1="500" x2="930" y2="665" class="arrow" marker-end="url(#head)"/>
  <text x="938" y="624" class="label">proofs · 127.0.0.1:6300</text>
  <text x="862" y="590" class="label" text-anchor="end">moth://engine/prover/*</text>
  <text x="862" y="604" class="label" text-anchor="end">in-process, no socket</text>
  <line x1="1060" y1="732" x2="1060" y2="757" class="arrow" marker-end="url(#head)"/>
  <line x1="900" y1="792" x2="843" y2="792" class="arrow" marker-end="url(#head)"/>
</svg>
