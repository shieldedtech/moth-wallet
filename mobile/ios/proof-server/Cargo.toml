[package]
name = "midnight-proof-server"
edition = "2024"
license = "Apache-2.0"
version = "8.1.3-local"
publish = false

[features]
default = []
experimental = ["dep:zkir-v3"]

[dependencies]
ledger = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-ledger", default-features = false, features = ["proving"] }
zswap = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-zswap" }
base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-base-crypto" }
transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-transient-crypto" }
storage = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-storage" }
serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-serialize" }

zkir = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-zkir" }
zkir-v3 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-zkir-v3", optional = true }

introspection = "0.1.0"
# rand 0.9.0 is not yet supported by some of our dependencies, we will
# stick with 0.8.0 for now.
rand = { version = "^0.8.4", features = ["getrandom"] }
actix-web = { version = "^4.13.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "cookies"] }
actix-cors = "^0.7.1"
futures = "^0.3.31"
futures-util = "0.3.32"
clap = { version = "^4.5.40", features = ["derive", "env"] }
tracing = "^0.1.41"
tracing-subscriber = "^0.3.19"
lazy_static = "^1.5.0"
regex = "1.11.1"
hex = "^0.4.3"
uuid = { version = "1.22.0", features = ["v4"] }
thiserror = "2.0.12"
tokio = "1.46.1"
async-channel = "2.5.0"
time = { version = "0.3.47", features = ["serde-human-readable"] }
serde = "1.0.219"

