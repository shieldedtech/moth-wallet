[package]
name = "mn-mobile-bench"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "mn-mobile-bench"
path = "src/main.rs"

[dependencies]
base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-base-crypto" }
transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-transient-crypto" }
coin-structure = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-coin-structure" }
storage = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-storage" }
midnight-zswap = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3" }
zkir_v2 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-zkir" }
rand = { version = "^0.8.4", features = ["getrandom"] }
tokio = { version = "^1.46.1", features = ["rt"] }
rayon = "^1.10.0"
serde_json = "1"
libc = "0.2"
serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.1.3", package = "midnight-serialize" }

[profile.release]
debug = false
lto = "thin"
